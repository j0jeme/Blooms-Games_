<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a);
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
/* ===== butterflies (inline SVG, flapping wings) ===== */
const PAL=[['#e8707a','#f4978e'],['#d4475a','#f08a8a'],['#f29aa0','#f8c4c4'],['#c9485b','#e8a0a0'],['#e8a57a','#f4978e']];
function bf(sz,p){const[a,b]=p||PAL[0];return `<svg class="bf" width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"><g class="wl"><path d="M47 47C30 43 14 31 16 18C18 6 33 10 42 22C48 30 50 39 47 47Z" fill="${a}"/><path d="M53 47C70 43 86 31 84 18C82 6 67 10 58 22C52 30 50 39 53 47Z" fill="${a}"/></g><g class="wr"><path d="M47 53C30 57 14 69 16 82C18 94 33 90 42 78C48 70 50 61 47 53Z" fill="${b}"/><path d="M53 53C70 57 86 69 84 82C82 94 67 90 58 78C52 70 50 61 53 53Z" fill="${b}"/></g><circle cx="50" cy="50" r="3.2" fill="#fff" opacity=".9"/></svg>`}
const pal=()=>PAL[0|Math.random()*PAL.length];
$('#logo').innerHTML=bf(54);$('#logo').style.cssText='display:flex;justify-content:center';
for(let i=0;i<3;i++){const d=document.createElement('div');d.className='fly';d.style.cssText=`left:${rnd(0,92)}%;top:${rnd(0,90)}%;--x:${rnd(-120,120)}px;--y:${rnd(-140,140)}px;--t:${rnd(7,14)}s;--d:${-rnd(0,8)}s`;d.innerHTML=bf(0|rnd(26,58),pal());$('#sky').append(d)}

/* ===== solver & generator ===== */
const PEERS=Array.from({length:81},(_,i)=>{const r=0|i/9,c=i%9,s=new Set();for(let k=0;k<9;k++){s.add(r*9+k);s.add(k*9+c)}const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)s.add((br+a)*9+bc+b);s.delete(i);return[...s]});

 if(bi<0)return 1;if(!bc)return 0;const ds=[];for(let d=1;d<10;d++)if(bm>>d&1)ds.push(d);if(rand)sh(ds);let n=0;
 for(const d of ds){g[bi]=d;n+=solve(g,lim-n,rand);if(n>=lim)return n}g[bi]=0;return n}
function make(diff){const g=Array(81).fill(0);solve(g,1,true);const sol=g.slice(),p=g.slice(),target={easy:42,medium:34,hard:28}[diff];let left=81;
 for(const i of sh([...Array(81).keys()])){if(left<=target)break;const v=p[i];p[i]=0;if(solve(p.slice(),2,false)!==1)p[i]=v;else left--}return{sol,puz:p}}
/* ===== state ===== */
let diff='easy',sol,puz,val,notes,sel=-1,nm=false,mist=0,secs=0,hist=[],won=false,bests={};
const KEY='papillon';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({diff,sol,puz,val,notes,mist,secs,won,bests}))}catch(e){}};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d)return false;bests=d.bests||{};if(d.won||!d.sol)return false;({diff,sol,puz,val,notes,mist,secs}=d);return true}catch(e){return false}}
function newGame(df){diff=df||diff;const g=make(diff);sol=g.sol;puz=g.puz;val=puz.slice();notes=Array(81).fill(0);sel=-1;mist=0;secs=0;hist=[];won=false;$('#modal').classList.remove('on');render();save()}
/* ===== board ===== */
const B=$('#board'),cells=[];
for(let i=0;i<81;i++){const c=document.createElement('button');const r=0|i/9,k=i%9;c.className='c'+(k%3==2&&k<8?' r3':'')+(r%3==2&&r<8?' b3':'')+(k==8?' r9':'')+(r==8?' b9':'');c.setAttribute('role','gridcell');c.onclick=()=>{sel=i;render()};B.append(c);cells.push(c)}
const seg=$('#seg');['easy','medium','hard'].forEach(d=>{const b=document.createElement('button');b.textContent=d[0].toUpperCase()+d.slice(1);b.dataset.d=d;b.onclick=()=>newGame(d);seg.append(b)});
const pad=$('#pad');for(let d=1;d<10;d++){const b=document.createElement('button');b.className='k';b.dataset.d=d;b.innerHTML=`${d}<small></small>`;b.onclick=()=>place(d);pad.append(b)}
const fmt=s=>String(0|s/60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function render(){
 const sv=sel>=0?val[sel]:0,cnt=Array(10).fill(0);
 for(let i=0;i<81;i++){const c=cells[i],v=val[i];let cl=c.className.replace(/ ?\b(g|sel|peer|same|err)\b/g,'');
  if(puz[i])cl+=' g';if(i===sel)cl+=' sel';else if(sel>=0&&sv&&v===sv)cl+=' same';else if(sel>=0&&PEERS[sel].includes(i))cl+=' peer';
  if(v&&v!==sol[i])cl+=' err';else if(v)cnt[v]++;cl=cl.trim();if(c.className!==cl)c.className=cl;
  let h='';if(v)h=`<span class="v">${v}</span>`;else if(notes[i]){h='<div class="n">';for(let d=1;d<10;d++)h+=`<span>${notes[i]>>d&1?d:''}</span>`;h+='</div>'}
  if(c._h!==h){c.innerHTML=h;c._h=h;c.setAttribute('aria-label',`Row ${1+(0|i/9)} column ${1+i%9}, ${v||'empty'}`)}}
 pad.querySelectorAll('.k').forEach(b=>{const d=+b.dataset.d,left=9-cnt[d];b.disabled=left<=0;b.querySelector('small').textContent=left>0?left:''});
 seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===diff));
 $('#ms').textContent=mist;$('#tm').textContent=fmt(secs);$('#notes').setAttribute('aria-pressed',nm);$('#nl').textContent='Notes '+(nm?'on':'off')}
const snap=()=>{hist.push([val.slice(),notes.slice()]);if(hist.length>150)hist.shift()};
const units=i=>{const r=0|i/9,c=i%9,br=r-r%3,bc=c-c%3;return[[...Array(9)].map((_,k)=>r*9+k),[...Array(9)].map((_,k)=>k*9+c),[...Array(9)].map((_,k)=>(br+(0|k/3))*9+bc+k%3)]};
function afterCorrect(i,d){PEERS[i].forEach(p=>notes[p]&=~(1<<d));const r=cells[i].getBoundingClientRect();
 if(units(i).some(u=>u.every(k=>val[k]===sol[k])))burst(r.left+r.width/2,r.top+r.height/2,4)}
function place(d){if(sel<0||puz[sel]||won)return;const i=sel;
 if(nm){if(val[i])return;snap();notes[i]^=1<<d}
 else{if(val[i]===d)return;snap();val[i]=d;notes[i]=0;cells[i].classList.remove('pop','shake');void cells[i].offsetWidth;
  if(d!==sol[i]){mist++;cells[i].classList.add('shake')}else{cells[i].classList.add('pop');afterCorrect(i,d)}}
 render();save();checkWin()}
function erase(){if(sel<0||puz[sel]||won||(!val[sel]&&!notes[sel]))return;snap();val[sel]=0;notes[sel]=0;render();save()}
function undo(){const h=hist.pop();if(!h||won)return;[val,notes]=h;render();save()}
function hint(){if(won)return;let i=sel;if(i<0||puz[i]||val[i]===sol[i]){const o=[...Array(81).keys()].filter(k=>val[k]!==sol[k]);if(!o.length)return;i=o[0|Math.random()*o.length]}
 snap();sel=i;val[i]=sol[i];notes[i]=0;render();afterCorrect(i,sol[i]);cells[i].classList.add('pop');save();checkWin()}
function checkWin(){if(!val.every((v,k)=>v===sol[k]))return;won=true;const b=bests[diff];const nb=!b||secs<b;if(nb)bests[diff]=secs;save();
 for(let k=0;k<6;k++)setTimeout(()=>burst(rnd(innerWidth*.15,innerWidth*.85),rnd(innerHeight*.4,innerHeight*.9),4),k*250);
 setTimeout(()=>{$('#card').innerHTML=`${bf(90)}<h2>Beautifully done</h2><p>${diff[0].toUpperCase()+diff.slice(1)} solved in <b>${fmt(secs)}</b> with ${mist} slip${mist==1?'':'s'}.<br>${nb?'A new personal best!':'Best: '+fmt(bests[diff])}</p><button class="go" id="again">Play again</button>`;$('#again').onclick=()=>newGame();$('#modal').classList.add('on');$('#again').focus()},900)}
/* ===== controls ===== */
$('#undo').onclick=undo;$('#erase').onclick=erase;$('#hint').onclick=hint;$('#new').onclick=()=>newGame();
$('#notes').onclick=()=>{nm=!nm;render()};
addEventListener('keydown',e=>{if(won)return;const k=e.key;
 if(/^[1-9]$/.test(k))place(+k);else if(k==='Backspace'||k==='Delete'||k==='0')erase();
 else if(k==='n'||k==='N'){nm=!nm;render()}else if(k==='h'||k==='H')hint();else if((k==='z'||k==='Z')&&(e.ctrlKey||e.metaKey)||k==='u'){e.preventDefault();undo()}
 else if(k.startsWith('Arrow')){e.preventDefault();if(sel<0)sel=40;else{const r=0|sel/9,c=sel%9;sel=k=='ArrowUp'?((r+8)%9)*9+c:k=='ArrowDown'?((r+1)%9)*9+c:k=='ArrowLeft'?r*9+(c+8)%9:r*9+(c+1)%9}render()}});
setInterval(()=>{if(!won&&!document.hidden&&sol){secs++;$('#tm').textContent=fmt(secs);if(secs%10==0)save()}},1000);
if(!load())newGame('easy');else render();
})();

/* ===== registry & navigation ===== */
const GAMES={},ORDER=[];let cur=null;const reg=(id,g)=>{g.id=id;GAMES[id]=g;ORDER.push(id)};
function cards(){$('#cards').innerHTML='';ORDER.forEach(id=>{const g=GAMES[id],b=document.createElement('button');b.className='gc';b.setAttribute('aria-label','Play '+g.t);b.innerHTML=`<img class="cover" src="${COVERS[id]}" alt="${g.t} cover"><b>${g.t}</b><small>${g.tag}</small><em>${g.best()}</em>`;b.onclick=()=>open(id);$('#cards').append(b)});$('#sub').textContent=ORDER.length+' little games, one garden'}
function open(id){document.body.classList.add('ing');cur=GAMES[id];sfx.tap();$('#home').classList.add('hide');$('#game').classList.remove('hide');$('#ttl').textContent=cur.t;$('#gr').className=cur.full?'full':'';['bk','rs','hp'].forEach(i=>$('#'+i).classList.remove('hide'));$('#ps').classList.toggle('hide',!cur.pause);$('#gr').innerHTML='';cur.start($('#gr'))}
function back(){document.body.classList.remove('ing');if(cur&&cur.stop)cur.stop();cur=null;$('#gr').innerHTML='';$('#modal').classList.remove('on');$('#game').classList.add('hide');$('#home').classList.remove('hide');$('#ttl').textContent='';['bk','rs','hp','ps'].forEach(i=>$('#'+i).classList.add('hide'));cards()}
$('#bk').onclick=back;$('#rs').onclick=()=>cur&&cur.restart();$('#ps').onclick=()=>cur&&cur.pause&&cur.pause();$('#hp').onclick=()=>cur&&modal('How to play',`<p>${cur.how}</p>`,[['Got it']]);
const snd=()=>$('#sn').textContent=muted?'🔇':'🔊';$('#sn').onclick=()=>{muted=!muted;store.set('mute',muted);snd();sfx.tap()};snd();
const dk=()=>{document.body.classList.toggle('dark',store.get('dark',false));$('#th').textContent=store.get('dark',false)?'☀️':'🌙'};$('#th').onclick=()=>{store.set('dark',!store.get('dark',false));dk()};dk();
addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on')});
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls||'';if(txt)e.textContent=txt;return e};
function chips(box,list,get,set){box.innerHTML='';list.forEach(([k,l])=>{const b=mk('button','chip',l);b.onclick=()=>{set(k);chips(box,list,get,set)};b.setAttribute('aria-pressed',get()===k);box.append(b)})}
/* ===== 1. SUDOKU (the Papillon Sudoku page, hosted in a frame) ===== */
reg('sudoku',{t:'Sudoku',tag:'Unique puzzles, 3 levels',ic:'🔢',full:1,how:'Pick a cell, then a number. Use Notes for pencil marks, Undo, Erase and Hint. Same numbers and peers are highlighted; wrong entries turn red.',
 best(){try{const b=JSON.parse(localStorage.getItem('papillon')).bests;for(const k of['hard','medium','easy'])if(b[k])return k[0].toUpperCase()+k.slice(1)+' '+fmt(b[k])}catch(e){}return 'No record yet'},
 start(r){const f=document.createElement('iframe');f.title='Sudoku';f.srcdoc=$('#sdk').textContent.replace(/<\\\/script/g,'</script');r.append(f);this.f=f},
 restart(){try{this.f.contentDocument.querySelector('#new').click()}catch(e){}}});

 start(r){const me=this;r.innerHTML=`<div class="hud"><span>Score <b id="brs">0</b></span><span>Level <b id="brl">1</b></span><span id="brv" style="color:var(--deep)"></span><span>Best <b id="brb">0</b></span></div><div class="cw"><canvas id="brc" width="${BW}" height="${BH}"></canvas><div id="bro" class="ov hide" style="inset:auto 10% 26% 10%;padding:10px 14px;font-size:1.05rem;pointer-events:none"></div></div><p class="sm">Drag or ←/→ to move · tap / Space to launch · P to pause</p>`;
  me.cv=$('#brc');me.x=me.cv.getContext('2d');me.keys={};
  const bgc=document.createElement('canvas');bgc.width=BW;bgc.height=BH;{const q=bgc.getContext('2d'),g=q.createLinearGradient(0,0,BW,BH);g.addColorStop(0,'#FFF7F8');g.addColorStop(1,'#FFE3E8');q.fillStyle=g;q.fillRect(0,0,BW,BH);q.fillStyle='#FFB3BD55';for(let i=0;i<22;i++)for(let j=0;j<26;j++)q.fillRect(i*20+10,j*20+10,2,2)}me.bgc=bgc;

 draw(){const me=this,x=me.x;x.drawImage(me.bgc,0,0);
  for(const q of me.bk){if(!q.hp)continue;rrp(x,q.x,q.y,q.w,q.h,5);x.fillStyle=q.hp>1?'#C94F63':BCOL[q.c];x.fill();x.fillStyle='#ffffff55';x.fillRect(q.x+4,q.y+3,q.w-8,4);if(q.hp>1){x.strokeStyle='#7B2535';x.lineWidth=1.5;x.stroke()}}
  for(const p of me.pt){x.globalAlpha=Math.max(0,p.l/500);x.fillStyle=p.c;x.fillRect(p.x-3,p.y-3,6,6)}x.globalAlpha=1;
  rrp(x,me.pad,BPY,BPW,BPH,8);x.fillStyle='#FFB3BD';x.fill();x.lineWidth=2.5;x.strokeStyle='#C94F63';x.stroke();x.fillStyle='#C94F63';x.font='bold 13px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('♥',me.pad+BPW/2,BPY+BPH/2+1);
  const b=me.b;x.beginPath();x.arc(b.x,b.y,BR,0,7);x.fillStyle='#E8456A';x.fill();x.lineWidth=2;x.strokeStyle='#C94F63';x.stroke();x.beginPath();x.arc(b.x-2.5,b.y-2.5,2.4,0,7);x.fillStyle='#ffffffcc';x.fill()}});

/* ===== 8. CHECKERS ===== */
const CKD=[[-1,-1],[-1,1],[1,-1],[1,1]];
const ckDirs=p=>Math.abs(p)==2?CKD:p>0?CKD.slice(0,2):CKD.slice(2);
function ckJmp(b,i,p,path,caps,out){const r=i>>3,c=i&7;let any=false;
 for(const[dr,dc]of ckDirs(p)){const lr=r+2*dr,lc=c+2*dc;if(lr<0||lr>7||lc<0||lc>7)continue;const m=(r+dr)*8+c+dc,l=lr*8+lc;
  if(b[m]&&Math.sign(b[m])==-Math.sign(p)&&!b[l]){any=true;const pm=b[m],pro=Math.abs(p)==1&&(p>0?lr==0:lr==7),np=pro?p*2:p;b[m]=0;b[i]=0;b[l]=np;
   if(pro)out.push({path:[...path,l],caps:[...caps,m]});else ckJmp(b,l,np,[...path,l],[...caps,m],out);
   b[l]=0;b[i]=p;b[m]=pm}}
 if(!any&&path.length>1)out.push({path,caps})}
function ckMoves(b,side){const out=[];for(let i=0;i<64;i++)if(b[i]&&Math.sign(b[i])==side)ckJmp(b,i,b[i],[i],[],out);if(out.length)return out;
 for(let i=0;i<64;i++){const p=b[i];if(!p||Math.sign(p)!=side)continue;const r=i>>3,c=i&7;for(const[dr,dc]of ckDirs(p)){const nr=r+dr,nc=c+dc;if(nr<0||nr>7||nc<0||nc>7)continue;const t=nr*8+nc;if(!b[t])out.push({path:[i,t],caps:[]})}}return out}
function ckApply(b,mv){const nb=b.slice(),p=nb[mv.path[0]],e=mv.path[mv.path.length-1];nb[mv.path[0]]=0;mv.caps.forEach(c=>nb[c]=0);nb[e]=p==1&&e>>3==0?2:p==-1&&e>>3==7?-2:p;return nb}
function ckEval(b){let v=0;for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const r=i>>3,c=i&7,s=Math.sign(p);let x=Math.abs(p)==2?170:100+(s>0?7-r:r)*4;if(c>1&&c<6&&r>1&&r<6)x+=3;v+=s*x}return v}
function ckNeg(b,side,d,al,be){const ms=ckMoves(b,side);if(!ms.length)return -9000-d;if(d<=0)return side*ckEval(b);let best=-1e9;for(const m of ms){const v=-ckNeg(ckApply(b,m),-side,d-1,-be,-al);if(v>best)best=v;if(best>al)al=best;if(al>=be)break}return best}
reg('checkers',{t:'Checkers',tag:'Jump, capture, crown',ic:'♛',how:'Move diagonally on the dark squares. Jump over an opponent piece to capture it — captures are mandatory, and you must keep jumping when you can. Reach the far row to become a king ♛ (kings move both ways). Choose Single Player (you are Pink vs the computer) or 2 Players on one screen.',
 best:()=>'Wins '+store.get('ckw',0),
 start(r){const me=this;me.mode=store.get('ckm','1p');
  r.innerHTML=`<div class="chips" id="ckm"></div><div class="hud" id="cks"></div><div class="ckb" id="ckb"></div><p class="sm" id="ckt"></p>`;
  me.cells=[];const B=$('#ckb');for(let i=0;i<64;i++){const c=mk('button','ckc'+(((i>>3)+(i&7))%2?' d':''));c.setAttribute('aria-label','Row '+((i>>3)+1)+' column '+((i&7)+1));c.append(mk('span','ckp hide'));c.onclick=()=>me.click(i);B.append(c);me.cells.push(c)}
  me.restart()},
 stop(){clearTimeout(this.to)},
 restart(){const me=this;clearTimeout(me.to);me.b=Array(64).fill(0);for(let i=0;i<64;i++)if(((i>>3)+(i&7))%2){if(i>>3<3)me.b[i]=-1;else if(i>>3>4)me.b[i]=1}
  me.turn=1;me.sel=-1;me.cand=null;me.k=0;me.vb=null;me.lm=[];me.nc=0;me.over=false;me.busy=false;
  chips($('#ckm'),[['1p','Single Player'],['2p','2 Players']],()=>me.mode,k=>{me.mode=k;store.set('ckm',k);me.restart()});
  me.legal=ckMoves(me.b,1);me.rend()},
 name(s){const m=this.mode=='1p';return s>0?(m?'You':'Pink'):(m?'The computer':'Cream')},
 click(i){const me=this;if(me.over||me.busy||(me.mode=='1p'&&me.turn<0))return;
  const tg=me.targets();
  if(me.cand&&tg.includes(i)){me.step(i);return}
  if(me.k>0)return;
  const v=me.b[i];if(v&&Math.sign(v)==me.turn&&me.legal.some(m=>m.path[0]==i)){me.sel=i;me.cand=me.legal.filter(m=>m.path[0]==i);me.k=0;sfx.tap()}else{me.sel=-1;me.cand=null}
  me.rend()},
 targets(){const me=this;if(!me.cand)return[];return[...new Set(me.cand.map(m=>m.path[me.k+1]))]},
 step(i){const me=this,k=me.k;me.cand=me.cand.filter(m=>m.path[k+1]==i);me.k=k+1;
  const mv=me.cand[0];if(mv.caps.length){const vb=me.vb||me.b.slice();vb[mv.path[k+1]]=vb[mv.path[k]];vb[mv.path[k]]=0;vb[mv.caps[k]]=0;me.vb=vb;sfx.ok()}
  me.sel=i;
  const done=me.cand.find(m=>m.path.length==me.k+1);if(done)me.finish(done);else me.rend()},
 finish(mv){const me=this,p=me.b[mv.path[0]];me.b=ckApply(me.b,mv);me.lm=[mv.path[0],mv.path[mv.path.length-1]];me.vb=null;me.cand=null;me.sel=-1;me.k=0;
  if(mv.caps.length||Math.abs(p)==1)me.nc=0;else me.nc++;if(!mv.caps.length)sfx.pop();
  me.turn=-me.turn;me.legal=ckMoves(me.b,me.turn);me.rend();
  const cnt=s=>me.b.filter(x=>x&&Math.sign(x)==s).length;
  if(!me.legal.length){me.over=true;const w=-me.turn;if(w>0&&me.mode=='1p')store.set('ckw',store.get('ckw',0)+1);sfx.win();me.to=setTimeout(()=>{const r=$('#ckb').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,8);modal(me.mode=='1p'?(w>0?'You win!':'The computer wins'):(w>0?'Pink wins!':'Cream wins!'),'<p>'+(w>0?'Pink':'Cream')+' has '+cnt(w)+' piece'+(cnt(w)==1?'':'s')+' left.</p>',[['Play again',()=>me.restart()],['Menu',back,1]])},500);me.rend();return}
  if(me.nc>=80){me.over=true;me.rend();me.to=setTimeout(()=>modal("It's a draw",'<p>No progress for a long time.</p>',[['Play again',()=>me.restart()],['Menu',back,1]]),400);return}
  if(me.mode=='1p'&&me.turn<0){me.busy=true;me.to=setTimeout(()=>me.cpu(),450)}},
 cpu(){const me=this;if(me.over)return;const ms=me.legal,left=me.b.filter(Boolean).length,D=left<=8?6:5;let best=-1e9,pk=[];
  for(const m of ms){const v=-ckNeg(ckApply(me.b,m),1,D-1,-1e9,1e9);if(v>best){best=v;pk=[m]}else if(v==best)pk.push(m)}
  me.busy=false;me.finish(pick(pk))},
 rend(){const me=this,b=me.vb||me.b,tg=me.targets(),forced=me.legal.length&&me.legal[0].caps.length&&!me.cand&&!me.over&&!(me.mode=='1p'&&me.turn<0),can=forced?new Set(me.legal.map(m=>m.path[0])):null;
  for(let i=0;i<64;i++){const c=me.cells[i],v=b[i],cls='ckc'+(((i>>3)+(i&7))%2?' d':'')+(i==me.sel?' sel':'')+(tg.includes(i)?' tg':'')+(me.lm.includes(i)?' lm':'');if(c._c!==cls){c.className=cls;c._c=cls}
   const pc='ckp'+(v?(v>0?' a':' b')+(Math.abs(v)==2?' k':'')+(can&&can.has(i)?' can':''):' hide'),e=c.firstChild;if(e._c!==pc){e.className=pc;e._c=pc}}
  const cnt=s=>b.filter(x=>x&&Math.sign(x)==s).length;
  $('#cks').innerHTML=`<span>Pink <b>${cnt(1)}</b></span><span>Cream <b>${cnt(-1)}</b></span>`;
  $('#ckt').textContent=me.over?'Game over':me.mode=='1p'?(me.turn>0?(me.k?'Keep jumping!':forced?'Your move — you must capture':'Your move'):'Thinking…'):(me.turn>0?'Pink':'Cream')+(me.k?' — keep jumping!':forced?' to move — must capture':' to move')}});

cards();
})();
